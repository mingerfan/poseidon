<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #687386; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 13px; fill: #586579; }
      .pct { font-size: 15px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="920" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">示意图 2｜通信覆盖时间与覆盖率</text>
  <text x="70" y="94" class="subtitle">Rx 看目标端隐藏情况；Tx 看源端并发与资源竞争风险。统计的是 GPU P2P activity，不是 CPU API。</text>

  <!-- Concept card -->
  <rect x="70" y="130" width="1460" height="185" rx="18" fill="white" filter="url(#shadow)"/>
  <text x="100" y="170" class="label">单次传输示意（目标 GPU）</text>
  <text x="100" y="211" class="small">目标计算</text>
  <rect x="240" y="190" width="630" height="34" rx="7" fill="#25a18e"/>
  <text x="555" y="213" text-anchor="middle" fill="white" font-size="14" font-weight="650">独立计算 45μs</text>
  <text x="100" y="268" class="small">P2P传输</text>
  <rect x="380" y="247" width="840" height="34" rx="7" fill="#25a18e"/>
  <rect x="1010" y="247" width="210" height="34" rx="7" fill="#f3a54a"/>
  <text x="695" y="270" text-anchor="middle" fill="white" font-size="14" font-weight="650">被目标端计算覆盖 45μs</text>
  <text x="1115" y="270" text-anchor="middle" fill="#713b08" font-size="14" font-weight="650">未覆盖 15μs</text>
  <rect x="1270" y="187" width="220" height="96" rx="12" fill="#eefbf7" stroke="#b9eadc"/>
  <text x="1380" y="222" text-anchor="middle" class="small">目标端覆盖率</text>
  <text x="1380" y="260" text-anchor="middle" font-size="28" font-weight="750" fill="#17836f">75%</text>

  <!-- Main chart -->
  <rect x="70" y="345" width="1460" height="500" rx="18" fill="white" filter="url(#shadow)"/>
  <g transform="translate(100,375)">
    <rect x="0" y="0" width="24" height="16" rx="3" fill="#25a18e"/><text x="34" y="13" class="small">与对应 GPU 计算重叠</text>
    <rect x="220" y="0" width="24" height="16" rx="3" fill="#f3a54a"/><text x="254" y="13" class="small">未覆盖</text>
    <text x="1360" y="13" text-anchor="end" class="small">条形长度表示该方向通信 wall time；内部比例表示覆盖率</text>
  </g>

  <!-- labels and bars, common width 900 -->
  <g transform="translate(110,425)">
    <text x="0" y="25" class="label">GPU0 Rx</text><rect x="135" y="4" width="675" height="30" rx="6" fill="#25a18e"/><rect x="810" y="4" width="225" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="25" class="pct">75%</text><text x="1130" y="25" class="small">0.90 / 1.20ms</text>
    <text x="0" y="75" class="label">GPU0 Tx</text><rect x="135" y="54" width="414" height="30" rx="6" fill="#25a18e"/><rect x="549" y="54" width="186" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="75" class="pct">69%</text><text x="1130" y="75" class="small">0.55 / 0.80ms</text>

    <text x="0" y="135" class="label">GPU1 Rx</text><rect x="135" y="114" width="429" height="30" rx="6" fill="#25a18e"/><rect x="564" y="114" width="59" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="135" class="pct">88%</text><text x="1130" y="135" class="small">0.57 / 0.65ms</text>
    <text x="0" y="185" class="label">GPU1 Tx</text><rect x="135" y="164" width="638" height="30" rx="6" fill="#25a18e"/><rect x="773" y="164" width="225" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="185" class="pct">74%</text><text x="1130" y="185" class="small">0.85 / 1.15ms</text>

    <text x="0" y="245" class="label">GPU2 Rx</text><rect x="135" y="224" width="483" height="30" rx="6" fill="#25a18e"/><rect x="618" y="224" width="42" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="245" class="pct">92%</text><text x="1130" y="245" class="small">0.64 / 0.70ms</text>
    <text x="0" y="295" class="label">GPU2 Tx</text><rect x="135" y="274" width="456" height="30" rx="6" fill="#25a18e"/><rect x="591" y="274" width="107" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="295" class="pct">81%</text><text x="1130" y="295" class="small">0.61 / 0.75ms</text>

    <text x="0" y="355" class="label">GPU3 Rx</text><rect x="135" y="334" width="520" height="30" rx="6" fill="#25a18e"/><rect x="655" y="334" width="305" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="355" class="pct">63%</text><text x="1130" y="355" class="small">0.69 / 1.10ms</text>
    <text x="0" y="405" class="label">GPU3 Tx</text><rect x="135" y="384" width="548" height="30" rx="6" fill="#25a18e"/><rect x="683" y="384" width="90" height="30" rx="6" fill="#f3a54a"/><text x="1050" y="405" class="pct">86%</text><text x="1130" y="405" class="small">0.73 / 0.85ms</text>
  </g>
  <text x="1515" y="885" text-anchor="end" class="small">示意数据，仅用于确认图形表达方式</text>
</svg>
