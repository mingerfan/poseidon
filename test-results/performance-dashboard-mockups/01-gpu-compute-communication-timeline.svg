<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #687386; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 13px; fill: #586579; }
      .inside { font-size: 14px; font-weight: 650; fill: white; }
      .axis { font-size: 13px; fill: #677489; }
      .grid { stroke: #dce3ed; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f08a24"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="920" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">示意图 1｜四卡 GPU 计算—通信时间轴</text>
  <text x="70" y="94" class="subtitle">这里统计 GPU 上实际执行的 kernel 与 P2P，不统计 CPU 的 cudaLaunchKernel / cudaMemcpyAsync API 时长</text>

  <g transform="translate(1015,42)">
    <rect x="0" y="0" width="28" height="17" rx="4" fill="#2aa876"/><text x="38" y="14" class="small">计算 kernel</text>
    <rect x="145" y="0" width="28" height="17" rx="4" fill="#f08a24"/><text x="183" y="14" class="small">P2P Tx/Rx</text>
    <rect x="300" y="0" width="28" height="17" rx="4" fill="white" stroke="#cfd8e5"/><text x="338" y="14" class="small">无 GPU activity</text>
  </g>

  <rect x="55" y="125" width="1490" height="730" rx="18" fill="white" filter="url(#shadow)"/>

  <!-- Time axis -->
  <line x1="250" y1="160" x2="1510" y2="160" stroke="#8793a7" stroke-width="1.5"/>
  <g>
    <line x1="250" y1="155" x2="250" y2="825" class="grid"/><text x="250" y="145" text-anchor="middle" class="axis">24.6140s</text>
    <line x1="565" y1="155" x2="565" y2="825" class="grid"/><text x="565" y="145" text-anchor="middle" class="axis">24.6150s</text>
    <line x1="880" y1="155" x2="880" y2="825" class="grid"/><text x="880" y="145" text-anchor="middle" class="axis">24.6160s</text>
    <line x1="1195" y1="155" x2="1195" y2="825" class="grid"/><text x="1195" y="145" text-anchor="middle" class="axis">24.6170s</text>
    <line x1="1510" y1="155" x2="1510" y2="825" class="grid"/><text x="1510" y="145" text-anchor="middle" class="axis">24.6180s</text>
  </g>

  <!-- GPU0 -->
  <g>
    <rect x="75" y="180" width="1450" height="137" rx="12" fill="#f8fafc" stroke="#e5eaf1"/>
    <text x="95" y="215" class="label">GPU0</text>
    <text x="170" y="209" class="small">Compute</text><text x="170" y="274" class="small">P2P</text>
    <line x1="250" y1="224" x2="1510" y2="224" stroke="#e1e7ef"/>
    <line x1="250" y1="289" x2="1510" y2="289" stroke="#e1e7ef"/>
    <rect x="250" y="190" width="170" height="38" rx="7" fill="#2aa876"/><text x="335" y="215" text-anchor="middle" class="inside">KS@L8</text>
    <rect x="1245" y="190" width="155" height="38" rx="7" fill="#2aa876"/><text x="1322" y="215" text-anchor="middle" class="inside">Rotate@L8</text>
    <rect x="1412" y="190" width="98" height="38" rx="7" fill="#218a63"/><text x="1461" y="215" text-anchor="middle" class="inside">NTT@L7</text>
    <rect x="657" y="260" width="20" height="26" rx="4" fill="#f08a24"/><text x="667" y="308" text-anchor="middle" class="small">Rx</text>
    <rect x="865" y="260" width="19" height="26" rx="4" fill="#f08a24"/><text x="874" y="308" text-anchor="middle" class="small">Rx</text>
    <rect x="1070" y="260" width="21" height="26" rx="4" fill="#f08a24"/><text x="1080" y="308" text-anchor="middle" class="small">Rx</text>
    <line x1="420" y1="238" x2="1245" y2="238" stroke="#d25555" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="832" y="251" text-anchor="middle" font-size="14" font-weight="650" fill="#c94444">GPU0 计算间隔约 2.62ms（示意）</text>
  </g>

  <!-- GPU1 -->
  <g>
    <rect x="75" y="330" width="1450" height="137" rx="12" fill="#f8fafc" stroke="#e5eaf1"/>
    <text x="95" y="365" class="label">GPU1</text>
    <text x="170" y="359" class="small">Compute</text><text x="170" y="424" class="small">P2P</text>
    <rect x="250" y="340" width="350" height="38" rx="7" fill="#2aa876"/><text x="425" y="365" text-anchor="middle" class="inside">Rotate@L8</text>
    <rect x="614" y="340" width="210" height="38" rx="7" fill="#218a63"/><text x="719" y="365" text-anchor="middle" class="inside">KS@L8</text>
    <rect x="840" y="340" width="305" height="38" rx="7" fill="#2aa876"/><text x="992" y="365" text-anchor="middle" class="inside">inverse NTT@L7</text>
    <rect x="1160" y="340" width="330" height="38" rx="7" fill="#218a63"/><text x="1325" y="365" text-anchor="middle" class="inside">Rotate@L7</text>
    <rect x="657" y="410" width="20" height="26" rx="4" fill="#f08a24"/>
    <rect x="1070" y="410" width="21" height="26" rx="4" fill="#f08a24"/>
  </g>

  <!-- GPU2 -->
  <g>
    <rect x="75" y="480" width="1450" height="137" rx="12" fill="#f8fafc" stroke="#e5eaf1"/>
    <text x="95" y="515" class="label">GPU2</text>
    <text x="170" y="509" class="small">Compute</text><text x="170" y="574" class="small">P2P</text>
    <rect x="250" y="490" width="260" height="38" rx="7" fill="#218a63"/><text x="380" y="515" text-anchor="middle" class="inside">KS@L8</text>
    <rect x="525" y="490" width="220" height="38" rx="7" fill="#2aa876"/><text x="635" y="515" text-anchor="middle" class="inside">Rotate@L8</text>
    <rect x="762" y="490" width="285" height="38" rx="7" fill="#218a63"/><text x="904" y="515" text-anchor="middle" class="inside">KS@L7</text>
    <rect x="1062" y="490" width="420" height="38" rx="7" fill="#2aa876"/><text x="1272" y="515" text-anchor="middle" class="inside">inverse NTT@L7</text>
  </g>

  <!-- GPU3 -->
  <g>
    <rect x="75" y="630" width="1450" height="137" rx="12" fill="#f8fafc" stroke="#e5eaf1"/>
    <text x="95" y="665" class="label">GPU3</text>
    <text x="170" y="659" class="small">Compute</text><text x="170" y="724" class="small">P2P</text>
    <rect x="250" y="640" width="420" height="38" rx="7" fill="#2aa876"/><text x="460" y="665" text-anchor="middle" class="inside">inverse NTT@L8</text>
    <rect x="686" y="640" width="205" height="38" rx="7" fill="#218a63"/><text x="788" y="665" text-anchor="middle" class="inside">KS@L8</text>
    <rect x="910" y="640" width="300" height="38" rx="7" fill="#2aa876"/><text x="1060" y="665" text-anchor="middle" class="inside">Rotate@L7</text>
    <rect x="1225" y="640" width="265" height="38" rx="7" fill="#218a63"/><text x="1357" y="665" text-anchor="middle" class="inside">KS@L7</text>
    <rect x="865" y="710" width="19" height="26" rx="4" fill="#f08a24"/>
  </g>

  <!-- Transfer arrows -->
  <path d="M 667 410 C 625 372, 625 324, 667 286" fill="none" stroke="#f08a24" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="685" y="432" class="small">Tx→GPU0 · 576KiB</text>
  <path d="M 874 710 C 820 590, 820 410, 874 286" fill="none" stroke="#f08a24" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="894" y="733" class="small">Tx→GPU0 · 576KiB</text>
  <path d="M 1080 410 C 1130 370, 1130 326, 1080 286" fill="none" stroke="#f08a24" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1100" y="432" class="small">Tx→GPU0 · 576KiB</text>

  <rect x="75" y="790" width="1450" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="95" y="818" font-size="14" fill="#9a4e12">诊断方式：先看通信落在哪些算子之间，再放大 CPU worker 时间轴解释传输为何提交晚、消费者为何继续得晚。</text>
  <text x="1515" y="885" text-anchor="end" class="small">示意数据，仅用于确认图形表达方式</text>
</svg>
