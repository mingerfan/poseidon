<text x="64" y="541" text-anchor="start" class="label">物理计划已确认：第一次Boot前，Q9直接ModSwitch到Q6，确实丢掉3Q。</text>
<text x="64" y="577" text-anchor="start" class="note">两边每段“卷积3Q + ReLU22Q”的算术开销相同；Boot位置不同，让ReLU出口一直相差3Q。</text>
<text x="64" y="610" text-anchor="start" class="small">这是有效Q预算的损失，不是额外3次RS。图中只画主路径；残差分支见文字解释。</text>
<text x="44" y="657" text-anchor="start" class="small">依据：regional-q34/scale-trace.json；Q34物理计划Boot入口审计；历史manual34的阶段约束与18个Boot位置。</text>
